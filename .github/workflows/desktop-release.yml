name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            command: npm run dist:desktop
            artifact_glob: |
              release/*.AppImage
              release/*.deb
          - platform: windows
            os: windows-2022
            command: npm run dist:win
            artifact_glob: |
              release/*.exe
              release/*.blockmap
              release/latest.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fakeroot libarchive-tools libfuse2t64

      - name: Check release version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Build installer
        shell: bash
        run: ${{ matrix.command }} -- --publish never

      - name: Smoke test packaged Playwright MCP
        shell: bash
        run: |
          resources=release/linux-unpacked/resources
          runtime=node
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            resources=release/win-unpacked/resources
            runtime=node.exe
          fi
          # Run outside the checkout so project node_modules cannot mask missing dependencies.
          probe=$(mktemp -d)
          cp -R "$resources/playwright-runtime" "$probe/"
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' |
            "$resources/node-runtime/$runtime" "$probe/playwright-runtime/playwright-mcp.mjs" > "$probe/reply.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1])); if (!r.result?.tools.some(t => t.name === 'browser_open')) process.exit(1)" "$probe/reply.json"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-installers-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-installers-*
          merge-multiple: true
          path: release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd release
          for ext in exe deb AppImage; do
            files=( *."$ext" )
            [[ ${#files[@]} == 1 && -s "${files[0]}" ]]
          done
          sha256sum *.exe *.deb *.AppImage > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./* --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
